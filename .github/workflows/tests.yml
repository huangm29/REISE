name: Core models
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[train]"
      - run: tr-xas check
      - run: python -m unittest discover -s tests -v
      - run: tr-xas demo --assets examples/demo_assets --out runs/demo_cpu --device cpu
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}
          path: runs/demo_cpu/verification.json
